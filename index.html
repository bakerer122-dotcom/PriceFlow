<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e75335"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><title>PriceFlow</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="brand"><img src="icon-192.png" alt=""><div><h1>PriceFlow</h1><small data-i="tagline">حاسبة الأسعار الذكية</small></div></div><div class="tools"><button id="lang" class="small">EN</button><button id="theme" class="small">☾</button></div></header><nav><button class="tab active" data-page="calc" data-i="calc">الحاسبة</button><button class="tab" data-page="history" data-i="history">السجل</button><button class="tab" data-page="settings" data-i="settings">الإعدادات</button></nav><section id="calc" class="page active"><div class="panel"><div class="sectionhead"><h2 data-i="input">الأسعار الأصلية</h2><span id="count" class="muted"></span></div><textarea id="prices" spellcheck="false" placeholder="3081&#10;5767&#10;4184&#10;4664"></textarea><div class="actions"><button id="paste" class="outline" data-i="paste">لصق</button><button id="clear" class="outline" data-i="clear">مسح الكل</button></div><p id="error" class="error" role="alert"></p></div><div class="panel"><h2 data-i="increase">نسبة الزيادة</h2><div class="percent"><button data-percent="10">10%</button><button data-percent="15" class="selected">15%</button><button data-percent="25">25%</button><button id="customBtn" data-i="custom">مخصص</button></div><div id="customBox" hidden><label for="custom" data-i="customLabel">النسبة المخصصة %</label><input id="custom" type="number" min="-100" max="100000" step="any" value="5" inputmode="decimal"></div></div><div class="panel"><div class="sectionhead"><h2 data-i="result">النتائج</h2><span class="muted" data-i="round">تقريب للأعلى دائماً</span></div><pre id="results" aria-live="polite"></pre><button id="copy" class="primary" data-i="copy">نسخ الأسعار</button><p id="notice" class="muted"></p></div></section><section id="history" class="page"><div class="panel"><div class="sectionhead"><h2 data-i="history">السجل</h2><span id="histCount" class="muted"></span></div><div id="historyList"></div></div></section><section id="settings" class="page"><div class="panel"><h2 data-i="account">الحساب والمزامنة</h2><p id="accountState" class="muted"></p><button id="signIn" class="primary" data-i="signin">تسجيل الدخول بحساب Google</button><button id="signOut" class="outline" hidden data-i="signout">تسجيل الخروج</button><p class="muted" data-i="firebaseNote">لتفعيل Google والمزامنة أضف إعدادات Firebase إلى ملف firebase-config.js.</p></div><div class="panel"><h2 data-i="about">عن البرنامج</h2><p data-i="aboutText">السجل يحتفظ بآخر 50 عملية. تنحفظ العملية عند النسخ فقط. الحاسبة تعمل بدون حساب.</p></div></section><footer>PriceFlow · PWA</footer></main><script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
